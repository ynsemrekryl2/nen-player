[package]
name = "nen-ffi"
description = "The single external FFI gate for the Nen Player core (ADR-0006)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
# staticlib → Apple hedefleri, cdylib → uniffi-bindgen --library modu.
crate-type = ["lib", "staticlib", "cdylib"]
name = "nen_ffi"

# Binding üretici. Ayrı bir araç kurulmasına gerek kalmasın diye workspace
# içinde yaşar; scripts/build-apple.sh bunu çağırır.
[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"

[dependencies]
nen-app.workspace = true
uniffi = { workspace = true, features = ["cli"] }

# Test-only: `nen-providers::translation_mock::MockCallGate` gives
# `tests/translation_gate.rs` a pause point outside `TranslationCall`'s own
# delivery-gate lock (NEN-108). A dev-dependency never reaches the compiled
# `lib`/`staticlib`/`cdylib` artifacts or the generated bindings — ADR-0006
# kural 2/3's production dependency graph (`nen-ffi -> nen-app` only) is
# unchanged.
[dev-dependencies]
nen-providers.workspace = true
