# cargo-deny config — https://embarkstudios.github.io/cargo-deny/
# Denetlenen: license uygunluğu, güvenlik advisory'leri, kaynak kısıtlaması.
# `bans` (çoklu sürüm) yalnız uyarı — transitive dependency çakışmaları bu
# workspace'in kontrolü dışında (ör. uniffi'nin syn 2 ve 3'ü aynı anda çekmesi).

[graph]
all-features = false
no-default-features = false

[advisories]
ignore = []

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "Unicode-3.0",
    "MPL-2.0",
    # encoding_rs (ADR-0008, NEN-015) is licensed "(Apache-2.0 OR MIT) AND
    # BSD-3-Clause" — the BSD-3-Clause half covers its WHATWG-derived index
    # data specifically, not the crate as a whole.
    "BSD-3-Clause",
]
confidence-threshold = 0.8

[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "allow"
workspace-default-features = "allow"
external-default-features = "allow"
allow-workspace = false

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
